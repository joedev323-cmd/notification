spring.application.name=Notification-demo

server.port=8080

# H2 database
spring.datasource.url=jdbc:h2:file:./data/notificationdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SMTP server - replace with email server actual settings
#spring.mail.host=${SMTP_HOST}
#spring.mail.port=${SMTP_PORT:1025}
#spring.mail.username=${SMTP_USERNAME}
#spring.mail.password=${SMTP_PASSWORD}

# MailHog SMTP server
spring.mail.host=localhost
spring.mail.port=1025


spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Prevent indefinite SMTP connection delays
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
